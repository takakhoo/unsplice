[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unsplice"
version = "1.0.0"
description = "Exact recovery of speech features from federated ASR updates"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "numpy>=1.26", "scipy>=1.11"]

[project.optional-dependencies]
experiments = ["soundfile", "python_speech_features", "torchaudio", "matplotlib>=3.8", "jiwer", "openai-whisper", "speechbrain", "transformers"]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["unsplice"]

[tool.pytest.ini_options]
testpaths = ["tests"]
